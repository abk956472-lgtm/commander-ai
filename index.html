<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجري الإلكتروني للملابس</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tahoma', sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 22px;
            font-weight: bold;
        }
        .cart-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .product-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
            padding: 15px;
        }
        .product-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #ddd;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        .product-title {
            font-size: 18px;
            margin-bottom: 5px;
        }
        .product-price {
            color: #27ae60;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 10px;
        }
        .buy-btn {
            background-color: #25d366;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        .buy-btn:hover {
            background-color: #1ebd56;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">متجر الملابس العصري</div>
        <button class="cart-btn" onclick="openCart()">🛒 سلة المشتريات (<span id="cart-count">0</span>)</button>
    </header>

    <div class="container">
        <h2 style="margin-bottom: 20px; text-align: center;">أحدث تشكيلة ملابس</h2>
        <div class="products-grid">
            
            <!-- منتج 1 -->
            <div class="product-card">
                <div class="product-img" style="display:flex; align-items:center; justify-content:center; color:#777;">صورة المنتج 1</div>
                <div class="product-title">هودي عصري أنيق</div>
                <div class="product-price">3500 دج</div>
                <button class="buy-btn" onclick="orderOnWhatsApp('هودي عصري أنيق', '3500 دج')">اطلب عبر واتساب</button>
            </div>

            <!-- منتج 2 -->
            <div class="product-card">
                <div class="product-img" style="display:flex; align-items:center; justify-content:center; color:#777;">صورة المنتج 2</div>
                <div class="product-title">سروال جينز كلاسيك</div>
                <div class="product-price">2800 دج</div>
                <button class="buy-btn" onclick="orderOnWhatsApp('سروال جينز كلاسيك', '2800 دج')">اطلب عبر واتساب</button>
            </div>

            <!-- منتج 3 -->
            <div class="product-card">
                <div class="product-img" style="display:flex; align-items:center; justify-content:center; color:#777;">صورة المنتج 3</div>
                <div class="product-title">جاكيت شتوي فاخر</div>
                <div class="product-price">6000 دج</div>
                <button class="buy-btn" onclick="orderOnWhatsApp('جاكيت شتوي فاخر', '6000 دج')">اطلب عبر واتساب</button>
            </div>

        </div>
    </div>

    <script>
        // دالة لفتح واتساب مباشرة برسالة جاهزة بالمنتج المطلوب
        function orderOnWhatsApp(productName, productPrice) {
            let phoneNumber = "213XXXXXXXXX"; // ضع رقم الهاتف الخاص بك هنا مع رمز الدولة
            let message = `مرحباً، أريـد طلب هذا المنتج:\n*${productName}*\nالسعر: ${productPrice}`;
            let encodedMessage = encodeURIComponent(message);
            window.open(`https://wa.me/${phoneNumber}?text=${encodedMessage}`, '_blank');
        }

        function openCart() {
            alert("ميزة سلة المشتريات قيد التطوير، يمكنك استخدام زر 'اطلب عبر واتساب' مباشرة تحت كل منتج حالياً!");
        }
    </script>

</body>
</html>
