<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر CK-LUXE</title>
    <!-- مكتبة Supabase للاتصال بالسيرفر -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f4f9; margin: 0; padding: 20px; text-align: right; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        button { padding: 10px 20px; background: #000; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        input { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; }
        #adminPanel { display: none; margin-top: 20px; border-top: 2px solid #ddd; padding-top: 20px; }
        #loginBox { margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1>متجر CK-LUXE</h1>

    <!-- زر أو صندوق الدخول -->
    <div id="loginBox">
        <h3>تسجيل دخول التاجر</h3>
        <input type="email" id="username" placeholder="البريد الإلكتروني (مثال: abk956472@gmail.com)">
        <input type="password" id="password" placeholder="كلمة المرور">
        <button id="portalBtn" onclick="checkLogin()">دخول لوحة التاجر</button>
    </div>

    <!-- لوحة تحكم التاجر (تكون مخفية ولا تظهر إلا بعد الدخول) -->
    <div id="adminPanel">
        <h2>⚙️ لوحة تحكم التاجر</h2>
        <p>أهلاً بك، أنت الآن مسجل دخولك بصلاحيات كاملة.</p>
        <button onclick="logoutAdmin()" style="background: #d9534f;">تسجيل خروج</button>
    </div>
</div>

<script>
    // إعدادات الاتصال بـ Supabase (تأكد أن هذه البيانات مطابقة لمشروعك)
    const SUPABASE_URL = 'https://lvthnzfubrhyfnwqaxs.supabase.co';
    const SUPABASE_ANON_KEY = 'ضع_مفتاح_anon_الخاص_بك_هنا'; // ضع مفتاحك هنا
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let isUserAdmin = false;

    // التحقق مما إذا كان التاجر مسجل دخول مسبقاً عند فتح الصفحة
    window.addEventListener('DOMContentLoaded', async () => {
        let { data: { session } } = await supabaseClient.auth.getSession();
        if (session) {
            isUserAdmin = true;
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
        }
    });

    // دالة تسجيل الدخول الآمنة عبر Supabase
    async function checkLogin() {
        let email = document.getElementById('username').value.trim();
        let pass = document.getElementById('password').value.trim();

        if (!email || !pass) {
            alert('الرجاء إدخال البريد الإلكتروني وكلمة المرور!');
            return;
        }

        // الاتصال بسيرفر Supabase للتحقق من الحساب
        let { data, error } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: pass
        });

        if (error) {
            alert('خطأ في البريد أو كلمة المرور: ' + error.message);
        } else {
            isUserAdmin = true;
            alert('تم تسجيل الدخول بنجاح!');
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
        }
    }

    // دالة تسجيل الخروج
    async function logoutAdmin() {
        await supabaseClient.auth.signOut();
        isUserAdmin = false;
        alert('تم تسجيل الخروج بنجاح.');
        location.reload();
    }
</script>

</body>
</html>
